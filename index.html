<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motivating Christian - Thematic Scripture Shorts Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { color: #f59e0b; font-size: 20px; letter-spacing: 0.5px; margin-bottom: 4px; }
    p.sub { color: #94a3b8; font-size: 12px; }

    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1040px; width: 100%; }

    /* Control Panel */
    .controls { background: #131b2e; border: 1px solid #1e293b; border-radius: 14px; padding: 18px; flex: 1; min-width: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    label { font-size: 11px; color: #f59e0b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0a0f1d; color: #fff; font-size: 13px; outline: none; }
    
    .search-row { display: flex; gap: 8px; }
    .theme-badge-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 120px; overflow-y: auto; padding: 6px 0; }
    .badge { font-size: 11px; padding: 5px 10px; border-radius: 6px; background: #0a0f1d; border: 1px solid #334155; color: #94a3b8; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .badge:hover, .badge.active { background: #f59e0b; color: #000; font-weight: 700; border-color: #f59e0b; }

    .btn-row { display: flex; gap: 10px; margin-top: 4px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #d97706; color: #fff; }
    .btn-primary:hover { background: #b45309; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }

    .info-card { background: #0a0f1d; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.6; }
    .info-title { color: #f59e0b; font-weight: bold; margin-bottom: 4px; }

    /* 9:16 Shorts Canvas Preview */
    .preview-box { display: flex; flex-direction: column; align-items: center; }
    canvas { width: 270px; height: 480px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 2px solid #f59e0b; }
  </style>
</head>
<body>

  <header>
    <h1>MOTIVATING CHRISTIAN • THEMATIC SHORTS STUDIO</h1>
    <p class="sub">Select Any Biblical Theme & Pair with Classic Telugu Worship Songs</p>
  </header>

  <div class="container">
    <div class="controls">
      
      <!-- Theme Quick-Filter Buttons -->
      <div>
        <label>1. Select Scripture Theme / Situation</label>
        <div class="theme-badge-list" id="badgeContainer"></div>
      </div>

      <!-- Quick Search Bar -->
      <div>
        <label>Search Verse or Song (Telugu / English)</label>
        <input type="text" id="searchInput" placeholder="e.g. కాపరి, భయం, healing, praise..." oninput="handleSearch()">
      </div>

      <!-- Result Dropdown -->
      <div>
        <label>2. Pick Specific Scripture & Song</label>
        <select id="entrySelect" onchange="loadSelectedEntry()"></select>
      </div>

      <div class="info-card">
        <div class="info-title">🎵 Connected Telugu Worship Song:</div>
        <div id="songTitle" style="font-weight: 700; color: #facc15;">—</div>
        <div id="songDesc" style="color: #94a3b8; font-size: 11px; margin-top: 2px;">—</div>
      </div>

      <div class="info-card">
        <div class="info-title">📋 YouTube Shorts Caption & Tags:</div>
        <div id="ytMeta" style="font-size: 11px; color: #cbd5e1; word-break: break-word;">—</div>
      </div>

      <div class="btn-row">
        <button class="btn-primary" onclick="randomizeInTheme()">🔀 Pick Another in Theme</button>
        <button class="btn-download" onclick="downloadShortFrame()">⬇️ Download 9:16 PNG</button>
      </div>
    </div>

    <!-- 9:16 Live Canvas Preview -->
    <div class="preview-box">
      <canvas id="shortsCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <script>

      {
        theme: "PRAISE",
        verseTitle: "ఆనంద గానము",
        verseLines: ["యెహోవాయందు ఆనందించుడి,", "ఆయనయందు ఆనందించుటవలన", "మీకు బలము కలుగును."],
        reference: "— నెహెమ్యా 8:10",
        songName: "ఆనందమే నాలో ఆనందమే పరమానందమే",
        songThemes: "హృదయమును బలపరిచే పరిశుద్ధాత్మ ఆనందం."
      },

      // WISDOM & GUIDANCE
      {
        theme: "WISDOM",
        verseTitle: "జ్ఞానమును వెదకుడి",
        verseLines: ["యెహోవాయందు భయభక్తులు కలిగియుండుటయే", "జ్ఞానమునకు", "మూలము."],
        reference: "— సామెతలు 9:10",
        songName: "నీ చిత్తమే నా భాగ్యము నా యేసయ్యా",
        songThemes: "దేవుని భయభక్తులలో జీవించే వివేకం."
      }
    ];

    let currentTheme = "ALL";
    let filteredList = [...scriptureDatabase];
    let currentIndex = 0;

    const logoImg = new Image();
    logoImg.src = "logo.png";
    const qrImg = new Image();
    qrImg.src = "qr.png";

    function onImageReady() {
      renderCanvas(filteredList[currentIndex]);
    }
    logoImg.onload = onImageReady;
    qrImg.onload = onImageReady;

    // Render theme badges
    function initThemeBadges() {
      const badgeBox = document.getElementById("badgeContainer");
      badgeBox.innerHTML = "";
      bibleThemes.forEach(t => {
        const b = document.createElement("span");
        b.className = "badge" + (t.id === currentTheme ? " active" : "");
        b.innerText = t.name;
        b.onclick = () => selectTheme(t.id);
        badgeBox.appendChild(b);
      });
    }

    function selectTheme(themeId) {
      currentTheme = themeId;
      document.getElementById("searchInput").value = "";
      initThemeBadges();

      if (themeId === "ALL") {
        filteredList = [...scriptureDatabase];
      } else {
        filteredList = scriptureDatabase.filter(item => item.theme === themeId);
      }
      currentIndex = 0;
      updateDropdown();
      renderCanvas(filteredList[currentIndex]);
    }

    function handleSearch() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!q) {
        selectTheme(currentTheme);
        return;
      }

      filteredList = scriptureDatabase.filter(item => {
        return item.verseTitle.toLowerCase().includes(q) ||
               item.verseLines.join(" ").toLowerCase().includes(q) ||
               item.reference.toLowerCase().includes(q) ||
               item.songName.toLowerCase().includes(q);
      });

      currentIndex = 0;
      updateDropdown();
      if (filteredList.length > 0) {
        renderCanvas(filteredList[0]);
      }
    }

    function updateDropdown() {
      const select = document.getElementById("entrySelect");
      select.innerHTML = "";
      if (filteredList.length === 0) {
        const opt = document.createElement("option");
        opt.innerText = "No verses match this search";
        select.appendChild(opt);
        return;
      }

      filteredList.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = `${item.verseTitle} (${item.reference.replace('— ', '')}) — ${item.songName.split('(')[0]}`;
        select.appendChild(opt);
      });
      select.value = currentIndex;
    }

    function loadSelectedEntry() {
      currentIndex = parseInt(document.getElementById("entrySelect").value);
      renderCanvas(filteredList[currentIndex]);
    }

    function randomizeInTheme() {
      if (filteredList.length <= 1) return;
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * filteredList.length);
      } while (nextIdx === currentIndex && filteredList.length > 1);

      currentIndex = nextIdx;
      document.getElementById("entrySelect").value = currentIndex;
      renderCanvas(filteredList[currentIndex]);
    }

    // High-Resolution 9:16 Canvas Renderer
    function renderCanvas(item) {
      if (!item) return;
      const canvas = document.getElementById("shortsCanvas");
      const ctx = canvas.getContext("2d");

      // 1. Dark Aesthetic Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, 1920);
      bgGrad.addColorStop(0, "#050914");
      bgGrad.addColorStop(0.4, "#0f172a");
      bgGrad.addColorStop(0.8, "#050914");
      bgGrad.addColorStop(1, "#000000");
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, 1080, 1920);

      // 2. Divine Sunburst Glow Behind Logo
      const sunGlow = ctx.createRadialGradient(540, 290, 40, 540, 290, 500);
      sunGlow.addColorStop(0, "rgba(245, 158, 11, 0.35)");
      sunGlow.addColorStop(0.5, "rgba(245, 158, 11, 0.08)");
      sunGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = sunGlow;
      ctx.fillRect(0, 0, 1080, 1920);

      // 3. Double Gold Border Frame
      ctx.strokeStyle = "rgba(245, 158, 11, 0.35)";
      ctx.lineWidth = 3;
      ctx.strokeRect(36, 36, 1008, 1848);

      ctx.strokeStyle = "rgba(245, 158, 11, 0.85)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(48, 48, 984, 1824);

      const drawCorner = (x, y) => {
        ctx.fillStyle = "#f59e0b";
        ctx.fillRect(x - 6, y - 6, 12, 12);
      };
      drawCorner(48, 48);
      drawCorner(1032, 48);
      drawCorner(48, 1872);
      drawCorner(1032, 1872);

      // 4. Circular Logo Badge
      if (logoImg.complete && logoImg.naturalWidth > 0) {
        ctx.save();
        ctx.shadowColor = "rgba(245, 158, 11, 0.6)";
        ctx.shadowBlur = 30;
        ctx.beginPath();
        ctx.arc(540, 290, 140, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        ctx.drawImage(logoImg, 400, 150, 280, 280);
        ctx.restore();

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(540, 290, 140, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Header Title Bar
      ctx.fillStyle = "#f59e0b";
      ctx.font = "bold 46px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(item.verseTitle, 540, 520);

      // Gold Divider line with Cross
      ctx.fillStyle = "rgba(245, 158, 11, 0.6)";
      ctx.fillRect(320, 545, 170, 3);
      ctx.fillText("✝", 540, 554);
      ctx.fillRect(590, 545, 170, 3);

      // 6. Main Scripture Text
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 46px -apple-system, sans-serif";
      ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
      ctx.shadowBlur = 18;

      let startY = 780;
      item.verseLines.forEach(line => {
        ctx.fillText(line, 540, startY);
        startY += 90;
      });

      // Scripture Reference
      ctx.fillStyle = "#facc15";
      ctx.font = "italic bold 40px -apple-system, sans-serif";
      ctx.fillText(item.reference, 540, startY + 30);
      ctx.shadowBlur = 0;

      // 7. Connected Worship Song Banner
      ctx.fillStyle = "rgba(245, 158, 11, 0.4)";
      ctx.fillRect(200, 1260, 680, 2);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "bold 28px -apple-system, sans-serif";
      ctx.fillText("🎵 ధ్యాన గీతం (Connected Worship Song)", 540, 1315);

      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 40px -apple-system, sans-serif";
      ctx.fillText(item.songName, 540, 1375);

      ctx.fillStyle = "rgba(245, 158, 11, 0.4)";
      ctx.fillRect(200, 1420, 680, 2);

      // 8. Bottom Section: QR Code & Call to Action
      const qrX = 770, qrY = 1530, qrSize = 210;
      if (qrImg.complete && qrImg.naturalWidth > 0) {
        ctx.save();
        ctx.shadowColor = "rgba(245, 158, 11, 0.5)";
        ctx.shadowBlur = 20;
        ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
        ctx.restore();

        ctx.strokeStyle = "#f59e0b";
        ctx.lineWidth = 3;
        ctx.strokeRect(qrX, qrY, qrSize, qrSize);
      }

      ctx.textAlign = "left";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 38px -apple-system, sans-serif";
      ctx.fillText("ఆమెన్ అని కామెంట్ చేయండి", 90, 1610);

      ctx.fillStyle = "#f59e0b";
      ctx.font = "bold 32px -apple-system, sans-serif";
      ctx.fillText("@Motivatingchristian", 90, 1670);

      ctx.fillStyle = "#94a3b8";
      ctx.font = "24px -apple-system, sans-serif";
      ctx.fillText("👉 Scan QR to Subscribe on YouTube", 90, 1725);

      // Update Dashboard Info Cards
      document.getElementById("songTitle").innerText = item.songName;
      document.getElementById("songDesc").innerText = item.songThemes;
      document.getElementById("ytMeta").innerText = 
        `${item.verseTitle} 🙏 | ${item.reference} | Song: ${item.songName} #Shorts #TeluguChristian #MotivatingChristian`;
    }

    function downloadShortFrame() {
      const canvas = document.getElementById("shortsCanvas");
      const link = document.createElement("a");
      const cleanRef = filteredList[currentIndex].reference.replace(/[^a-zA-Z0-9]/g, "_");
      link.download = `MotivatingChristian_${cleanRef}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    window.onload = () => {
      initThemeBadges();
      updateDropdown();
      renderCanvas(filteredList[0]);
    };
  </script>
</body>
</html>
