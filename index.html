<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Motivating Christian • Studio Engine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #060911; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 14px; }
    
    header { text-align: center; margin-bottom: 12px; }
    h1 { color: #f59e0b; font-size: 20px; letter-spacing: 0.5px; margin-bottom: 3px; }
    p.sub { color: #94a3b8; font-size: 12px; }

    .container { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 1100px; width: 100%; }

    .controls { background: #0f172a; border: 1px solid #1e293b; border-radius: 14px; padding: 16px; flex: 1; min-width: 340px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
    label { font-size: 11px; color: #f59e0b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input, textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #0a0f1d; color: #fff; font-size: 12px; outline: none; }
    textarea { resize: vertical; height: 65px; line-height: 1.4; }

    .style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .style-btn { padding: 7px 4px; font-size: 11px; border: 1px solid #334155; border-radius: 6px; background: #0a0f1d; color: #cbd5e1; cursor: pointer; font-weight: 600; text-align: center; }
    .style-btn.active { border-color: #f59e0b; background: #1e293b; color: #f59e0b; font-weight: 700; }

    .duration-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .duration-btn { padding: 6px; font-size: 11px; border: 1px solid #334155; border-radius: 6px; background: #0a0f1d; color: #94a3b8; cursor: pointer; font-weight: 600; text-align: center; }
    .duration-btn.active { background: #d97706; color: #fff; border-color: #f59e0b; font-weight: 700; }

    /* Audio Trimmer */
    .audio-panel {
      background: #0a0f1d;
      border: 1px dashed #f59e0b;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .audio-panel input[type="file"] { border: none; padding: 0; background: transparent; font-size: 11px; color: #94a3b8; }
    .trim-readout { display: flex; justify-content: space-between; align-items: center; font-size: 11px; background: #020617; padding: 6px 10px; border-radius: 6px; border: 1px solid #1e293b; }
    .trim-controls { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6px; }
    .trim-btn { padding: 6px 8px; font-size: 11px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; text-align: center; }
    .btn-play-all { background: #334155; color: #fff; }
    .btn-mark-in { background: #f59e0b; color: #000; }
    .btn-test-clip { background: #10b981; color: #fff; }

    .yt-search-box { display: flex; gap: 6px; }
    .btn-yt-go { background: #dc2626; color: #fff; border: none; border-radius: 8px; padding: 0 12px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-yt-go:hover { background: #b91c1c; }

    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: #0a0f1d; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 11px; color: #cbd5e1; }
    .switch-btn { background: #334155; color: #94a3b8; border: none; border-radius: 6px; padding: 4px 10px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .switch-btn.active { background: #10b981; color: #fff; }

    .theme-badge-list { display: flex; flex-wrap: wrap; gap: 5px; max-height: 85px; overflow-y: auto; padding: 2px 0; }
    .badge { font-size: 10px; padding: 4px 8px; border-radius: 6px; background: #0a0f1d; border: 1px solid #334155; color: #94a3b8; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .badge:hover, .badge.active { background: #f59e0b; color: #000; font-weight: 700; border-color: #f59e0b; }

    .custom-box { display: flex; flex-direction: column; gap: 6px; background: #070d19; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; }

    .btn-row { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 6px; margin-top: 4px; }
    button.action-btn { padding: 11px 6px; border: none; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-primary { background: #d97706; color: #fff; }
    .btn-primary:hover { background: #b45309; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }
    .btn-video { background: #8b5cf6; color: #fff; }
    .btn-video:hover { background: #7c3aed; }
    .btn-video.recording { background: #ef4444; animation: pulseRec 1s infinite; }

    .btn-copy { background: #334155; color: #38bdf8; padding: 6px 10px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600; cursor: pointer; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-copy:hover { background: #475569; }

    @keyframes pulseRec { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    .info-card { background: #0a0f1d; border: 1px solid #1e293b; border-radius: 8px; padding: 10px; font-size: 12px; line-height: 1.5; }
    .info-title { color: #f59e0b; font-weight: bold; margin-bottom: 2px; }

    .preview-box { display: flex; flex-direction: column; align-items: center; }
    canvas { width: 270px; height: 480px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.9); border: 2px solid #f59e0b; }
  </style>
</head>
<body>

  <header>
    <h1>MOTIVATING CHRISTIAN • SHORTS STUDIO</h1>
    <p class="sub">Dynamic Thematic Explorer • 5:00 AM Daily Verses • Total Bible Mode</p>
  </header>

  <div class="container">
    <div class="controls">
      
      <!-- Visual Themes -->
      <div>
        <label>Visual Atmosphere Theme</label>
        <div class="style-grid">
          <button id="theme_gold" class="style-btn active" onclick="setVisualTheme('gold')">👑 Royal Gold</button>
          <button id="theme_dawn" class="style-btn" onclick="setVisualTheme('dawn')">🌅 Dawn Sunrise</button>
          <button id="theme_emerald" class="style-btn" onclick="setVisualTheme('emerald')">🌿 Sacred Olive</button>
          <button id="theme_midnight" class="style-btn" onclick="setVisualTheme('midnight')">🌌 Celestial Midnight</button>
          <button id="theme_flame" class="style-btn" onclick="setVisualTheme('flame')">🔥 Pentecost Flame</button>
          <button id="theme_zion" class="style-btn" onclick="setVisualTheme('zion')">🕊️ Mount Zion</button>
        </div>
      </div>

      <!-- Duration Selector -->
      <div>
        <label>Shorts Recording Duration</label>
        <div class="duration-grid">
          <button id="dur_15" class="duration-btn active" onclick="setDuration(15)">⚡ 15 Seconds</button>
          <button id="dur_30" class="duration-btn" onclick="setDuration(30)">⏳ 30 Seconds</button>
          <button id="dur_60" class="duration-btn" onclick="setDuration(60)">🎬 60 Seconds</button>
        </div>
      </div>

      <!-- Mark-In Audio Trimmer -->
      <div>
        <label>Dynamic Audio Trimmer (Play & Mark In-Point)</label>
        <div class="audio-panel">
          <input type="file" id="audioFileInput" accept="audio/*" onchange="handleAudioUpload(event)">
          
          <div class="trim-readout">
            <span>Now: <b id="currPlayTime" style="color:#38bdf8;">0:00</b></span>
            <span>Clip: <b id="clipRangeDisplay" style="color:#f59e0b;">0:00 ➔ 0:15</b></span>
            <span>Span: <b id="clipSpanDisplay" style="color:#10b981;">15s</b></span>
          </div>

          <input type="range" id="audioScrubber" min="0" max="100" value="0" step="0.2" oninput="handleManualScrub(this.value)">

          <div class="trim-controls">
            <button id="btnPlayAll" class="trim-btn btn-play-all" onclick="togglePlayFull()">▶ Play Audio</button>
            <button class="trim-btn btn-mark-in" onclick="markInPoint()">🎯 Mark Start</button>
            <button id="btnTestClip" class="trim-btn btn-test-clip" onclick="testTrimmedSpan()">🔁 Test Span</button>
          </div>
        </div>
      </div>

      <!-- YouTube Song Selection -->
      <div>
        <label>Selected YouTube Song (Shown on Poster / Video)</label>
        <div class="yt-search-box">
          <input type="text" id="customSongInput" placeholder="Type or paste song from YouTube (e.g. Yahweh Neeve Na...)" oninput="handleCustomSongChange()">
          <button class="btn-yt-go" onclick="triggerYouTubeSearch()">▶ Search YT</button>
        </div>
      </div>

      <div class="toggle-row">
        <span>Suggested Matches Column:</span>
        <button id="suggestToggleBtn" class="switch-btn active" onclick="toggleSuggestionColumn()">ENABLED (ON)</button>
      </div>

      <!-- Situational Themes -->
      <div>
        <label>Situational Theme</label>
        <div class="theme-badge-list" id="badgeContainer"></div>
      </div>

      <!-- Scripture Controls -->
      <div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <label style="margin:0;">Select Scripture</label>
          <button style="width:auto; padding:4px 8px; font-size:10px; background:#f59e0b; color:#000; border:none; border-radius:4px; font-weight:700; cursor:pointer;" onclick="loadDailyMorningVerse()">🌅 Today's 5:00 AM Verse</button>
        </div>
        <input type="text" id="searchVerseInput" placeholder="Search scripture keywords (e.g. కాపరి, భయం, బలం)..." oninput="handleFilteredSearch()">
      </div>

      <div>
        <select id="entrySelect" onchange="loadSelectedEntry()"></select>
      </div>

      <!-- Manual Insertion Box (Total Bible PDF Archive Integration) -->
      <div class="custom-box">
        <label style="color:#38bdf8;">Manual Entry / Any Verse from Telugu Bible</label>
        <input type="text" id="manualTitleInput" placeholder="Heading (e.g. నేటి దేవుని వాగ్దానం)">
        <textarea id="manualVerseInput" placeholder="Paste Telugu verse lines here..."></textarea>
        <input type="text" id="manualRefInput" placeholder="Reference (e.g. — కీర్తనలు 23:1)">
        <button class="btn-copy" style="background:#0284c7; color:#fff;" onclick="applyManualVerse()">⚡ Render Custom Verse from Bible</button>
      </div>

      <!-- Suggested Song Card -->
      <div class="info-card" id="suggestionCard">
        <div class="info-title">💡 Auto-Suggested Reference Song:</div>
        <div id="suggestedSongTitle" style="font-weight: 700; color: #facc15;">—</div>
        <div id="suggestedSongDesc" style="color: #94a3b8; font-size: 11px;">—</div>
        <button class="btn-copy" style="margin-top: 5px;" onclick="useSuggestedSong()">Use This Suggestion ↵</button>
      </div>

      <!-- Metadata Box -->
      <div class="info-card">
        <div class="info-title">📋 YouTube Metadata (Ready to Copy):</div>
        <div id="ytMeta" style="font-size: 11px; color: #cbd5e1; word-break: break-word;">—</div>
        <button class="btn-copy" id="copyBtn" onclick="copyFullMetadata()">📋 Copy Caption & Tags</button>
      </div>

      <!-- Action Buttons -->
      <div class="btn-row">
        <button class="action-btn btn-primary" onclick="randomizeInTheme()">🔀 Shuffle</button>
        <button class="action-btn btn-download" onclick="downloadShortFrame()">🖼️ PNG</button>
        <button id="recordBtn" class="action-btn btn-video" onclick="recordVideo()">🎬 Record 15s</button>
      </div>
    </div>

    <!-- Live Animated 9:16 Canvas -->
    <div class="preview-box">
      <canvas id="shortsCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <script>
    const visualStyles = {
      gold: {
        bgTop: "#040711", bgMid: "#0c1527", bgBottom: "#020307",
        glowColor: "rgba(245, 158, 11, ", accentColor: "#f59e0b", subColor: "#38bdf8",
        particleColor: "rgba(250, 204, 21, ", borderOuter: "rgba(245, 158, 11, 0.4)", borderInner: "rgba(245, 158, 11, 0.85)"
      },
      dawn: {
        bgTop: "#280738", bgMid: "#581230", bgBottom: "#110217",
        glowColor: "rgba(251, 146, 60, ", accentColor: "#fb923c", subColor: "#f472b6",
        particleColor: "rgba(251, 146, 60, ", borderOuter: "rgba(251, 146, 60, 0.4)", borderInner: "rgba(251, 146, 60, 0.85)"
      },
      emerald: {
        bgTop: "#012019", bgMid: "#043c2e", bgBottom: "#01120e",
        glowColor: "rgba(52, 211, 153, ", accentColor: "#34d399", subColor: "#6ee7b7",
        particleColor: "rgba(52, 211, 153, ", borderOuter: "rgba(52, 211, 153, 0.4)", borderInner: "rgba(52, 211, 153, 0.85)"
      },
      midnight: {
        bgTop: "#05051f", bgMid: "#121442", bgBottom: "#02020a",
        glowColor: "rgba(99, 102, 241, ", accentColor: "#818cf8", subColor: "#38bdf8",
        particleColor: "rgba(129, 140, 248, ", borderOuter: "rgba(99, 102, 241, 0.4)", borderInner: "rgba(129, 140, 248, 0.85)"
      },
      flame: {
        bgTop: "#210404", bgMid: "#4c0505", bgBottom: "#0d0101",
        glowColor: "rgba(239, 68, 68, ", accentColor: "#f87171", subColor: "#fbbf24",
        particleColor: "rgba(248, 113, 113, ", borderOuter: "rgba(239, 68, 68, 0.4)", borderInner: "rgba(248, 113, 113, 0.85)"
      },
      zion: {
        bgTop: "#082f49", bgMid: "#075985", bgBottom: "#021a2c",
        glowColor: "rgba(56, 189, 248, ", accentColor: "#38bdf8", subColor: "#facc15",
        particleColor: "rgba(250, 204, 21, ", borderOuter: "rgba(56, 189, 248, 0.4)", borderInner: "rgba(56, 189, 248, 0.85)"
      }
    };

    let activeStyleKey = "gold";
    let selectedDuration = 15;
    let suggestionsEnabled = true;
    let customSongOverride = "";
    let activeManualItem = null;

    function setVisualTheme(key) {
      activeStyleKey = key;
      document.querySelectorAll(".style-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("theme_" + key).classList.add("active");
    }

    function setDuration(seconds) {
      selectedDuration = seconds;
      document.querySelectorAll(".duration-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("dur_" + seconds).classList.add("active");
      document.getElementById("recordBtn").innerText = `🎬 Record ${selectedDuration}s`;
      document.getElementById("clipSpanDisplay").innerText = `${selectedDuration}s`;

      if (audioElement && audioElement.duration) {
        clampAndRefreshTrimmer();
      }
    }

    function toggleSuggestionColumn() {
      suggestionsEnabled = !suggestionsEnabled;
      const card = document.getElementById("suggestionCard");
      const btn = document.getElementById("suggestToggleBtn");
      if (suggestionsEnabled) {
        card.style.display = "block";
        btn.classList.add("active");
        btn.innerText = "ENABLED (ON)";
      } else {
        card.style.display = "none";
        btn.classList.remove("active");
        btn.innerText = "DISABLED (OFF)";
      }
      updateCards();
    }

    function triggerYouTubeSearch() {
      const input = document.getElementById("customSongInput").value.trim();
      const currentSuggested = (filteredList[currentIndex] && filteredList[currentIndex].songName) ? filteredList[currentIndex].songName.split('(')[0] : "";
      const q = encodeURIComponent((input || currentSuggested) + " telugu christian song");
      window.open(`https://www.youtube.com/results?search_query=${q}`, '_blank');
    }

    function handleCustomSongChange() {
      customSongOverride = document.getElementById("customSongInput").value.trim();
      updateCards();
    }

    function useSuggestedSong() {
      const item = activeManualItem || filteredList[currentIndex];
      if (item) {
        document.getElementById("customSongInput").value = item.songName;
        customSongOverride = item.songName;
        updateCards();
      }
    }

    function getDisplaySong() {
      if (customSongOverride.length > 0) return customSongOverride;
      const item = activeManualItem || filteredList[currentIndex];
      if (suggestionsEnabled && item && item.songName) return item.songName;
      return "";
    }

    // THEMATIC BUCKETS
    const bibleThemes = [
      { id: "ALL", name: "అన్ని వాక్యాలు (All Themes)" },
      { id: "FEAR", name: "భయము & ఆందోళన (Fear & Anxiety)" },
      { id: "FAITH", name: "విశ్వాసము & నిరీక్షణ (Faith & Hope)" },
      { id: "HEALING", name: "స్వస్థత & విడుదల (Healing)" },
      { id: "PROVISION", name: "ఆర్థిక దీవెన (Provision & Blessing)" },
      { id: "FAMILY", name: "కుటుంబం & సమాధానం (Family Peace)" },
      { id: "VICTORY", name: "శోధనలు & విజయం (Victory)" },
      { id: "MORNING", name: "ఉదయకాల వాగ్దానాలు (Morning Guidance)" },
      { id: "PRAISE", name: "స్తుతి & కృతజ్ఞత (Praise & Worship)" }
    ];

    // EXPANDED TELUGU BIBLE DATABASE (MAPPED DIRECTLY TO SITUATIONAL THEMES)
    const scriptureDatabase = [
      // FEAR & ANXIETY
      { theme: "FEAR", verseTitle: "భయపడకుము", verseLines: ["భయపడకుము నేను నీకు తోడైయున్నాను,", "దిగులుపడకుము నేను నీ దేవుడనై యున్నాను;", "నేను నిన్ను బలపరతును."], reference: "— యెషయా 41:10", songName: "నీ కృపయే నా ఆశ్రయం (Nee Krupaye Naa Aasrayam)", songThemes: "భయం పోగొట్టే దేవుని అద్భుతమైన శాంతి మరియు కృప." },
      { theme: "FEAR", verseTitle: "శాంతినిచ్చు దేవుడు", verseLines: ["శాంతి మీకు అనుగ్రహించి వెళ్లుచున్నాను,", "నా శాంతినే మీకిచ్చుచున్నాను;", "మీ హృదయమును కలవరపడనియ్యకుడి."], reference: "— యోహాను 14:27", songName: "నా హృదయములో నీ శాంతి (Samadhaana Kartha)", songThemes: "లోకమివ్వలేని దేవుని పరలోక సమాధానం." },
      { theme: "FEAR", verseTitle: "భారము మోయువాడు", verseLines: ["నీ భారము యెహోవామీద మోపుము,", "ఆయన నిన్ను ఆదుకొనును;", "నీతిమంతుని ఎన్నడును కదలనీయడు."], reference: "— కీర్తనలు 55:22", songName: "భారము మోసే నా ప్రియ యేసు", songThemes: "మన సమస్త చింతలను ఆయనపై మోపుట." },
      { theme: "FEAR", verseTitle: "ఆపత్కాల ఆశ్రయం", verseLines: ["దేవుడు మనకు ఆశ్రయమును బలమునై యున్నాడు,", "ఆపత్కాలములో ఆయన నమ్ముకొనదగిన", "సహాయకుడు."], reference: "— కీర్తనలు 46:1", songName: "నా ఆశ్రయ దుర్గమా నా యేసయ్యా", songThemes: "ఎలాంటి ఆందోళనలోనైనా దేవుడే బలమైన కోట." },

      // FAITH & HOPE

    // 5:00 AM DAILY PERPETUAL ALGORITHM (Cycles every 24 hours at 5:00 AM IST)
    function loadDailyMorningVerse() {
      activeManualItem = null;
      const now = new Date();
      // Offset by 5 hours so the seed shifts precisely at 5:00 AM IST
      const effectiveDate = new Date(now.getTime() - (5 * 60 * 60 * 1000));
      const startOfYear = new Date(effectiveDate.getFullYear(), 0, 0);
      const diff = effectiveDate - startOfYear;
      const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
      
      currentTheme = "ALL";
      initThemeBadges();
      filteredList = [...scriptureDatabase];
      currentIndex = dayOfYear % filteredList.length;

      updateDropdown();
      alert(`🌅 Loaded today's 5:00 AM Verse (Day ${dayOfYear}): ${filteredList[currentIndex].verseTitle}`);
    }

    // AUDIO ENGINE
    let audioCtx = null;
    let analyserNode = null;
    let audioSourceNode = null;
    let audioElement = null;
    let audioDataArray = null;
    let hasCustomAudio = false;
    let audioTrimStart = 0;
    let isFullPlaying = false;
    let isTestingClip = false;
    let clipTimer = null;

    function handleAudioUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioElement) { audioElement.pause(); audioElement.remove(); }

      audioElement = document.createElement("audio");
      audioElement.src = URL.createObjectURL(file);

      audioElement.ontimeupdate = () => {
        document.getElementById("currPlayTime").innerText = formatTime(audioElement.currentTime);
      };

      audioElement.onloadedmetadata = () => {
        clampAndRefreshTrimmer();
      };

      analyserNode = audioCtx.createAnalyser();
      analyserNode.fftSize = 64;
      audioDataArray = new Uint8Array(analyserNode.frequencyBinCount);

      audioSourceNode = audioCtx.createMediaElementSource(audioElement);
      audioSourceNode.connect(analyserNode);
      analyserNode.connect(audioCtx.destination);

      hasCustomAudio = true;
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function clampAndRefreshTrimmer() {
      const scrubber = document.getElementById("audioScrubber");
      const maxStart = Math.max(0, audioElement.duration - selectedDuration);
      scrubber.max = maxStart;
      if (audioTrimStart > maxStart) audioTrimStart = maxStart;
      scrubber.value = audioTrimStart;

      const end = audioTrimStart + selectedDuration;
      document.getElementById("clipRangeDisplay").innerText = `${formatTime(audioTrimStart)} ➔ ${formatTime(end)}`;
      document.getElementById("clipSpanDisplay").innerText = `${selectedDuration}s`;
    }

    function handleManualScrub(val) {
      audioTrimStart = parseFloat(val);
      const end = audioTrimStart + selectedDuration;
      document.getElementById("clipRangeDisplay").innerText = `${formatTime(audioTrimStart)} ➔ ${formatTime(end)}`;
    }

    function togglePlayFull() {
      if (!audioElement) return alert("Attach an audio file first!");
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

      const btn = document.getElementById("btnPlayAll");
      if (isFullPlaying) {
        audioElement.pause();
        isFullPlaying = false;
        btn.innerText = "▶ Play Audio";
      } else {
        if (isTestingClip) stopClipTest();
        audioElement.play();
        isFullPlaying = true;
        btn.innerText = "⏸ Pause";
      }
    }

    function markInPoint() {
      if (!audioElement) return alert("Attach audio first!");
      const currentSec = audioElement.currentTime;
      const maxStart = Math.max(0, audioElement.duration - selectedDuration);
      audioTrimStart = Math.min(currentSec, maxStart);

      document.getElementById("audioScrubber").value = audioTrimStart;
      const end = audioTrimStart + selectedDuration;
      document.getElementById("clipRangeDisplay").innerText = `${formatTime(audioTrimStart)} ➔ ${formatTime(end)}`;

      const btn = event.target;
      btn.style.background = "#10b981";
      btn.innerText = "✅ Start Set!";
      setTimeout(() => { btn.style.background = "#f59e0b"; btn.innerText = "🎯 Mark Start"; }, 1200);
    }

    function testTrimmedSpan() {
      if (!audioElement) return alert("Attach audio first!");
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();

      const testBtn = document.getElementById("btnTestClip");
      if (isTestingClip) {
        stopClipTest();
        return;
      }

      if (isFullPlaying) togglePlayFull();

      audioElement.currentTime = audioTrimStart;
      audioElement.play();
      isTestingClip = true;
      testBtn.innerText = "⏹ Stop";
      testBtn.style.background = "#ef4444";

      clipTimer = setTimeout(() => {
        stopClipTest();
      }, selectedDuration * 1000);
    }

    function stopClipTest() {
      if (audioElement) audioElement.pause();
      clearTimeout(clipTimer);
      isTestingClip = false;
      const testBtn = document.getElementById("btnTestClip");
      testBtn.innerText = "🔁 Test Span";
      testBtn.style.background = "#10b981";
    }

    function copyFullMetadata() {
      const text = document.getElementById("ytMeta").innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.innerText = "✅ Copied to Clipboard!";
        btn.style.color = "#10b981";
        setTimeout(() => {
          btn.innerText = "📋 Copy Caption & Tags";
          btn.style.color = "#38bdf8";
        }, 2500);
      });
    }

    function handleFilteredSearch() {
      activeManualItem = null;
      const vQuery = document.getElementById("searchVerseInput").value.toLowerCase().trim();

      filteredList = scriptureDatabase.filter(item => {
        const matchesVerse = !vQuery || 
          item.verseTitle.toLowerCase().includes(vQuery) ||
          item.verseLines.join(" ").toLowerCase().includes(vQuery) ||
          item.reference.toLowerCase().includes(vQuery);

        const matchesTheme = (currentTheme === "ALL" || item.theme === currentTheme);
        return matchesVerse && matchesTheme;
      });

      currentIndex = 0;
      updateDropdown();
    }

    function initThemeBadges() {
      const badgeBox = document.getElementById("badgeContainer");
      badgeBox.innerHTML = "";
      bibleThemes.forEach(t => {
        const b = document.createElement("span");
        b.className = "badge" + (t.id === currentTheme ? " active" : "");
        b.innerText = t.name;
        b.onclick = () => selectTheme(t.id);
        badgeBox.appendChild(b);
      });
    }

    function selectTheme(themeId) {
      activeManualItem = null;
      currentTheme = themeId;
      initThemeBadges();
      handleFilteredSearch();
    }

    function updateDropdown() {
      const select = document.getElementById("entrySelect");
      select.innerHTML = "";
      if (filteredList.length === 0) {
        const opt = document.createElement("option");
        opt.innerText = "No matching scriptures found";
        select.appendChild(opt);
        return;
      }

      filteredList.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = `${item.verseTitle} (${item.reference.replace('— ', '')})`;
        select.appendChild(opt);
      });
      select.value = currentIndex;
      updateCards();
    }

    function loadSelectedEntry() {
      activeManualItem = null;
      currentIndex = parseInt(document.getElementById("entrySelect").value);
      updateCards();
    }

    function randomizeInTheme() {
      activeManualItem = null;
      if (filteredList.length <= 1) return;
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * filteredList.length);
      } while (nextIdx === currentIndex && filteredList.length > 1);

      currentIndex = nextIdx;
      document.getElementById("entrySelect").value = currentIndex;
      updateCards();
    }

    function updateCards() {
      const item = activeManualItem || filteredList[currentIndex];
      if (!item) return;

      document.getElementById("suggestedSongTitle").innerText = item.songName || "ధ్యాన గీతం";
      document.getElementById("suggestedSongDesc").innerText = item.songThemes || "దేవుని వాక్యమునకు తగిన ఆరాధన.";

      const songToDisplay = getDisplaySong();
      const songPart = songToDisplay ? ` | Song: ${songToDisplay}` : "";

      document.getElementById("ytMeta").innerText = 
        `${item.verseTitle} 🙏 | ${item.reference}${songPart} #Shorts #TeluguChristian #MotivatingChristian`;
    }

    // MAIN ANIMATION LOOP
    function startAnimationLoop() {
      const canvas = document.getElementById("shortsCanvas");
      const ctx = canvas.getContext("2d");

      function drawFrame(time) {
        const item = activeManualItem || filteredList[currentIndex];
        const style = visualStyles[activeStyleKey];

        if (item) {
          const pulse = Math.sin(time / 650);
          const rotAngle = (time / 8000) % (Math.PI * 2);
          const songText = getDisplaySong();

          // 1. Theme Gradient Background
          const bgGrad = ctx.createLinearGradient(0, 0, 0, 1920);
          bgGrad.addColorStop(0, style.bgTop);
          bgGrad.addColorStop(0.35, style.bgMid);
          bgGrad.addColorStop(0.8, style.bgTop);
          bgGrad.addColorStop(1, style.bgBottom);
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 1080, 1920);

          // 2. Volumetric God-Rays
          ctx.save();
          ctx.translate(540, 290);
          ctx.rotate(rotAngle);
          for (let r = 0; r < 8; r++) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 800, r * (Math.PI / 4) - 0.14, r * (Math.PI / 4) + 0.14);
            ctx.closePath();
            ctx.fillStyle = style.glowColor + "0.045)";
            ctx.fill();
          }
          ctx.restore();

          // 3. Upward Particles
          particles.forEach(p => {
            p.y -= p.speedY;
            if (p.y < 0) { p.y = 1920; p.x = Math.random() * 1080; }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = style.particleColor + p.alpha + ")";
            ctx.shadowColor = style.accentColor;
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
          });

          // 4. Central Sun Glow
          const sunRadius = 520 + pulse * 40;
          const sunGlow = ctx.createRadialGradient(540, 290, 40, 540, 290, sunRadius);
          sunGlow.addColorStop(0, style.glowColor + "0.38)");
          sunGlow.addColorStop(0.5, style.glowColor + "0.09)");
          sunGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = sunGlow;
          ctx.fillRect(0, 0, 1080, 1920);

          // 5. Borders
          ctx.strokeStyle = style.borderOuter;
          ctx.lineWidth = 3;
          ctx.strokeRect(36, 36, 1008, 1848);

          ctx.strokeStyle = style.borderInner;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(48, 48, 984, 1824);

          const drawCorner = (x, y) => {
            ctx.fillStyle = style.accentColor;
            ctx.fillRect(x - 6, y - 6, 12, 12);
          };
          drawCorner(48, 48);
          drawCorner(1032, 48);
          drawCorner(48, 1872);
          drawCorner(1032, 1872);

          // 6. Energy Ring & Logo
          ctx.strokeStyle = style.glowColor + (0.3 + pulse * 0.15) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(540, 290, 155 + pulse * 6, 0, Math.PI * 2);
          ctx.stroke();

          if (logoImg.complete && logoImg.naturalWidth > 0) {
            ctx.save();
            ctx.shadowColor = style.glowColor + "0.7)";
            ctx.shadowBlur = 25 + pulse * 10;
            ctx.beginPath();
            ctx.arc(540, 290, 140, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(logoImg, 400, 150, 280, 280);
            ctx.restore();

            ctx.strokeStyle = style.accentColor;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(540, 290, 140, 0, Math.PI * 2);
            ctx.stroke();
          }

          // 7. Title Bar
          ctx.fillStyle = style.accentColor;
          ctx.font = "bold 46px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(item.verseTitle, 540, 520);

          ctx.fillStyle = style.borderOuter;
          ctx.fillRect(320, 545, 170, 3);
          ctx.fillText("✝", 540, 554);
          ctx.fillRect(590, 545, 170, 3);

          // 8. Main Scripture
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 48px -apple-system, sans-serif";
          ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
          ctx.shadowBlur = 18;

          let startY = songText ? 780 : 840;
          item.verseLines.forEach(line => {
            ctx.fillText(line, 540, startY);
            startY += 94;
          });

          ctx.fillStyle = "#facc15";
          ctx.font = "italic bold 42px -apple-system, sans-serif";
          ctx.fillText(item.reference, 540, startY + 32);
          ctx.shadowBlur = 0;

          // 9. CONDITIONAL SONG BANNER & VISUALIZER
          if (songText) {
            ctx.fillStyle = style.borderOuter;
            ctx.fillRect(200, 1240, 680, 2);

            const barCount = 24;
            const barWidth = 6;
            const startBarX = 540 - ((barCount * 14) / 2);

            if (hasCustomAudio && analyserNode && audioDataArray) {
              analyserNode.getByteFrequencyData(audioDataArray);
            }

            for (let i = 0; i < barCount; i++) {
              let barH = 8;
              if (hasCustomAudio && audioDataArray) {
                const freqVal = audioDataArray[i % audioDataArray.length] || 0;
                barH = 6 + (freqVal / 255) * 60;
              } else {
                barH = 10 + Math.abs(Math.sin((time / 300) + (i * 0.4))) * 28;
              }
              ctx.fillStyle = style.subColor;
              ctx.fillRect(startBarX + i * 14, 1285 - barH / 2, barWidth, barH);
            }

            ctx.fillStyle = "#94a3b8";
            ctx.font = "bold 26px -apple-system, sans-serif";
            ctx.fillText("🎵 ధ్యాన గీతం (Worship Song)", 540, 1335);

            ctx.fillStyle = style.subColor;
            ctx.font = "bold 40px -apple-system, sans-serif";
            ctx.fillText(songText, 540, 1395);

            ctx.fillStyle = style.borderOuter;
            ctx.fillRect(200, 1440, 680, 2);
          }

          // 10. QR Code & Branding
          const qrX = 770, qrY = 1530, qrSize = 210;
          if (qrImg.complete && qrImg.naturalWidth > 0) {
            ctx.save();
            ctx.shadowColor = style.glowColor + "0.5)";
            ctx.shadowBlur = 20;
            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            ctx.restore();

            ctx.strokeStyle = style.accentColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(qrX, qrY, qrSize, qrSize);
          }

          ctx.textAlign = "left";
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 38px -apple-system, sans-serif";
          ctx.fillText("ఆమెన్ అని కామెంట్ చేయండి", 90, 1610);

          ctx.fillStyle = style.accentColor;
          ctx.font = "bold 32px -apple-system, sans-serif";
          ctx.fillText("@Motivatingchristian", 90, 1670);

          ctx.fillStyle = "#94a3b8";
          ctx.font = "24px -apple-system, sans-serif";
          ctx.fillText("👉 Scan QR to Subscribe on YouTube", 90, 1725);
        }

        requestAnimationFrame(drawFrame);
      }

      requestAnimationFrame(drawFrame);
    }

    // MULTI-DURATION RECORDING ENGINE
    let isRecording = false;

    function recordVideo() {
      if (isRecording) return;
      const canvas = document.getElementById("shortsCanvas");
      const recordBtn = document.getElementById("recordBtn");

      if (hasCustomAudio && audioElement) {
        if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
        audioElement.currentTime = audioTrimStart;
        audioElement.play();
      }

      const canvasStream = canvas.captureStream(30);
      let combinedStream = new MediaStream();
      canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));

      if (hasCustomAudio && audioSourceNode) {
        const dest = audioCtx.createMediaStreamDestination();
        audioSourceNode.connect(dest);
        dest.stream.getAudioTracks().forEach(track => combinedStream.addTrack(track));
      }

      let options = { mimeType: 'video/webm;codecs=vp9,opus' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(combinedStream, options);
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        if (hasCustomAudio && audioElement) {
          audioElement.pause();
        }
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const activeItem = activeManualItem || filteredList[currentIndex];
        const cleanRef = activeItem.reference.replace(/[^a-zA-Z0-9]/g, "_");
        a.download = `MotivatingChristian_${cleanRef}_${selectedDuration}s.webm`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);

        isRecording = false;
        recordBtn.classList.remove("recording");
        recordBtn.innerText = `🎬 Record ${selectedDuration}s`;
      };

      isRecording = true;
      recordBtn.classList.add("recording");
      let secondsLeft = selectedDuration;
      recordBtn.innerText = `🔴 Rec (${secondsLeft}s)...`;

      const countdown = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          recordBtn.innerText = `🔴 Rec (${secondsLeft}s)...`;
        } else {
          clearInterval(countdown);
        }
      }, 1000);

      recorder.start();
      setTimeout(() => {
        recorder.stop();
      }, selectedDuration * 1000);
    }

    function downloadShortFrame() {
      const canvas = document.getElementById("shortsCanvas");
      const link = document.createElement("a");
      const activeItem = activeManualItem || filteredList[currentIndex];
      const cleanRef = activeItem.reference.replace(/[^a-zA-Z0-9]/g, "_");
      link.download = `MotivatingChristian_${cleanRef}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    window.onload = () => {
      initThemeBadges();
      updateDropdown();
      setDuration(15);
      startAnimationLoop();
    };
  </script>
