<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motivating Christian - Animated Shorts Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #090d16; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    
    header { text-align: center; margin-bottom: 16px; }
    h1 { color: #f59e0b; font-size: 20px; letter-spacing: 0.5px; margin-bottom: 4px; }
    p.sub { color: #94a3b8; font-size: 12px; }

    .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; max-width: 1040px; width: 100%; }

    /* Control Panel */
    .controls { background: #131b2e; border: 1px solid #1e293b; border-radius: 14px; padding: 18px; flex: 1; min-width: 340px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    label { font-size: 11px; color: #f59e0b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0a0f1d; color: #fff; font-size: 13px; outline: none; }
    
    .theme-badge-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 95px; overflow-y: auto; padding: 4px 0; }
    .badge { font-size: 11px; padding: 5px 9px; border-radius: 6px; background: #0a0f1d; border: 1px solid #334155; color: #94a3b8; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .badge:hover, .badge.active { background: #f59e0b; color: #000; font-weight: 700; border-color: #f59e0b; }

    /* Visual Aesthetic Style Bar */
    .style-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .style-btn { padding: 8px 4px; font-size: 11px; border: 1px solid #334155; border-radius: 6px; background: #0a0f1d; color: #cbd5e1; cursor: pointer; font-weight: 600; text-align: center; }
    .style-btn.active { border-color: #f59e0b; background: #1e293b; color: #f59e0b; }

    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    button.action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #d97706; color: #fff; }
    .btn-primary:hover { background: #b45309; }
    .btn-download { background: #10b981; color: #fff; }
    .btn-download:hover { background: #059669; }
    .btn-video { background: #8b5cf6; color: #fff; }
    .btn-video:hover { background: #7c3aed; }
    .btn-video.recording { background: #ef4444; animation: pulseRecord 1s infinite; }

    @keyframes pulseRecord {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .info-card { background: #0a0f1d; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.6; }
    .info-title { color: #f59e0b; font-weight: bold; margin-bottom: 4px; }

    /* 9:16 Shorts Canvas Preview */
    .preview-box { display: flex; flex-direction: column; align-items: center; }
    canvas { width: 270px; height: 480px; border-radius: 18px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 2px solid #f59e0b; }
  </style>
</head>
<body>

  <header>
    <h1>MOTIVATING CHRISTIAN • ANIMATED SHORTS STUDIO</h1>
    <p class="sub">Direct MP4/WebM Video Recording & Multi-Theme Visual Aesthetics</p>
  </header>

  <div class="container">
    <div class="controls">
      
      <!-- Visual Palette Theme Selector -->
      <div>
        <label>Visual Color Theme</label>
        <div class="style-row">
          <button id="theme_gold" class="style-btn active" onclick="setVisualTheme('gold')">👑 Royal Gold</button>
          <button id="theme_dawn" class="style-btn" onclick="setVisualTheme('dawn')">🌅 Dawn of Hope</button>
          <button id="theme_emerald" class="style-btn" onclick="setVisualTheme('emerald')">🌿 Midnight Olive</button>
        </div>
      </div>

      <!-- Theme Badges -->
      <div>
        <label>Scripture Situation / Category</label>
        <div class="theme-badge-list" id="badgeContainer"></div>
      </div>

      <!-- Search Bar -->
      <div>
        <label>Search Verse or Song</label>
        <input type="text" id="searchInput" placeholder="e.g. కాపరి, భయం, healing, praise..." oninput="handleSearch()">
      </div>

      <!-- Pick Verse -->
      <div>
        <label>Scripture Selection</label>
        <select id="entrySelect" onchange="loadSelectedEntry()"></select>
      </div>

      <div class="info-card">
        <div class="info-title">🎵 Connected Telugu Worship Song:</div>
        <div id="songTitle" style="font-weight: 700; color: #facc15;">—</div>
        <div id="songDesc" style="color: #94a3b8; font-size: 11px; margin-top: 2px;">—</div>
      </div>

      <div class="info-card">
        <div class="info-title">📋 YouTube Shorts Caption & Tags:</div>
        <div id="ytMeta" style="font-size: 11px; color: #cbd5e1; word-break: break-word;">—</div>
      </div>

      <!-- Action Buttons -->
      <div class="btn-row">
        <button class="action-btn btn-primary" onclick="randomizeInTheme()">🔀 Shuffle</button>
        <button class="action-btn btn-download" onclick="downloadShortFrame()">🖼️ PNG</button>
        <button id="recordBtn" class="action-btn btn-video" onclick="recordAnimatedVideo()">🎬 Record 10s Video</button>
      </div>
    </div>

    <!-- Live Animated 9:16 Canvas -->
    <div class="preview-box">
      <canvas id="shortsCanvas" width="1080" height="1920"></canvas>
    </div>
  </div>

  <script>
    // VISUAL COLOR THEMES
    const visualStyles = {
      gold: {
        bgTop: "#050914",
        bgMid: "#0f172a",
        bgBottom: "#000000",
        glowColor: "rgba(245, 158, 11, ",
        accentColor: "#f59e0b",
        subColor: "#38bdf8",
        borderOuter: "rgba(245, 158, 11, 0.35)",
        borderInner: "rgba(245, 158, 11, 0.85)"
      },
      dawn: {
        bgTop: "#2a0845",
        bgMid: "#641838",
        bgBottom: "#13041c",
        glowColor: "rgba(251, 146, 60, ",
        accentColor: "#fb923c",
        subColor: "#f472b6",
        borderOuter: "rgba(251, 146, 60, 0.35)",
        borderInner: "rgba(251, 146, 60, 0.85)"
      },
      emerald: {
        bgTop: "#022c22",
        bgMid: "#064e3b",
        bgBottom: "#011710",
        glowColor: "rgba(52, 211, 153, ",
        accentColor: "#34d399",
        subColor: "#a7f3d0",
        borderOuter: "rgba(52, 211, 153, 0.35)",
        borderInner: "rgba(52, 211, 153, 0.85)"
      }
    };

    let activeStyleKey = "gold";

    function setVisualTheme(key) {
      activeStyleKey = key;
      document.querySelectorAll(".style-btn").forEach(btn => btn.classList.remove("active"));
      document.getElementById("theme_" + key).classList.add("active");
    }

    // THEMATIC SCRIPTURES
    const bibleThemes = [
      { id: "ALL", name: "అన్ని వాక్యాలు (All Themes)" },
      { id: "FEAR", name: "భయము & ఆందోళన (Fear & Anxiety)" },
      { id: "FAITH", name: "విశ్వాసము & నిరీక్షణ (Faith & Hope)" },
      { id: "HEALING", name: "స్వస్థత & విడుదల (Healing)" },
      { id: "PROVISION", name: "ఆర్థిక దీవెన (Provision & Blessing)" },
      { id: "FAMILY", name: "కుటుంబం & సమాధానం (Family Peace)" },
      { id: "VICTORY", name: "శోధనలు & విజయం (Victory)" },
      { id: "MORNING", name: "ఉదయకాల వాగ్దానాలు (Morning Guidance)" },
      { id: "PRAISE", name: "స్తుతి & కృతజ్ఞత (Praise & Worship)" }
    ];

    const scriptureDatabase = [
      { theme: "FEAR", verseTitle: "భయపడకుము", verseLines: ["భయపడకుము నేను నీకు తోడైయున్నాను,", "దిగులుపడకుము నేను నీ దేవుడనై యున్నాను;", "నేను నిన్ను బలపరతును."], reference: "— యెషయా 41:10", songName: "నీ కృపయే నా ఆశ్రయం (Nee Krupaye Naa Aasrayam)", songThemes: "భయం పోగొట్టే దేవుని అద్భుతమైన శాంతి మరియు కృప." },
      { theme: "FEAR", verseTitle: "శాంతినిచ్చు దేవుడు", verseLines: ["శాంతి మీకు అనుగ్రహించి వెళ్లుచున్నాను,", "నా శాంతినే మీకిచ్చుచున్నాను;", "మీ హృదయమును కలవరపడనియ్యకుడి."], reference: "— యోహాను 14:27", songName: "నా హృదయములో నీ శాంతి (Samadhaana Kartha)", songThemes: "లోకమివ్వలేని దేవుని పరలోక సమాధానం." },
      { theme: "FAITH", verseTitle: "ఆయన మన బలము", verseLines: ["నన్ను బలపరచువానియందే", "నేను సమస్తమును", "చేయగలనెను."], reference: "— ఫిలిప్పీయులకు 4:13", songName: "యేసే నా బలము యేసే నా జీవము", songThemes: "బలహీనతలను జయించే క్రీస్తు శక్తి." },
      { theme: "FAITH", verseTitle: "కొత్త బలము", verseLines: ["యెహోవాకొరకు ఎదురుచూచువారు", "నూతన బలము పొందుదురు;", "వారు పక్షిరాజులవలె రెక్కలు చాచి పైకెగయుదురు."], reference: "— యెషయా 40:31", songName: "పక్షిరాజు వలె నూతన బలముతో", songThemes: "విశ్వాసములో ఎన్నడూ అలసిపోని నిరీక్షణ." },
      { theme: "HEALING", verseTitle: "ఆరోగ్యపు వాగ్దానం", verseLines: ["నేను నీకు ఆరోగ్యము రప్పించెదను,", "నీ గాయములను మాన్పెదను;", "ఇది యెహోవా వాక్కు."], reference: "— యిర్మియా 30:17", songName: "స్వస్థపరచు యెహోవావు నీవే (Yehova Rapha)", songThemes: "శరీరమునకు మరియు అంతరంగానికి దైవిక స్వస్థత." },
      { theme: "HEALING", verseTitle: "గాయములను కట్టువాడు", verseLines: ["గుండె చెదరినవారిని ఆయన బాగుచేయును,", "వారి గాయములను", "కట్టును."], reference: "— కీర్తనలు 147:3", songName: "గాయపడిన మనసా కలత చెందకు", songThemes: "హృదయ వేదనలను ఓదార్చే దైవ ప్రేమ." },
      { theme: "PROVISION", verseTitle: "లేమి కలుగదు", verseLines: ["యెహోవా నా కాపరి,", "నాకు లేమి కలుగదు;", "పచ్చికగల చోట్ల నన్ను పరుండజేయును."], reference: "— కీర్తనలు 23:1-2", songName: "యెహోవా నా కాపరి (Yehova Naa Kaapari)", songThemes: "జీవితంలో ఏ కొరతా రానివ్వని కాపరి నడిపింపు." },
      { theme: "PROVISION", verseTitle: "మేలైన తలంపులు", verseLines: ["మీరు నిరీక్షణ కలిగియుండునట్లు", "నేను మీ విషయమై తలంచుచున్న", "సమాధానకరమైన తలంపులే."], reference: "— యిర్మియా 29:11", songName: "యేసయ్యా నీ ప్రేమ నాపై ఎంతో (Yesayya Nee Prema)", songThemes: "మన భవిష్యత్తు మరియు జీవితంపై దేవుని సంకల్పం." },
      { theme: "FAMILY", verseTitle: "గృహమునకు దీవెన", verseLines: ["నేనును నా యింటివారును", "యెహోవాను", "సేవించెదము."], reference: "— యెహోషువ 24:15", songName: "నేను నా యింటివారు ప్రభునే సేవించెదము", songThemes: "సకుటుంబంగా దేవుని సన్నిధిలో నిలిచే దీవెన." },
      { theme: "VICTORY", verseTitle: "జయమునిచ్చు దేవుడు", verseLines: ["మన ప్రభువైన యేసుక్రీస్తు ద్వారా", "మనకు జయము ననుగ్రహించుచున్న", "దేవునికి స్తోత్రము."], reference: "— 1 కొరింథీయులకు 15:57", songName: "జయమే జయము యేసు నామములో", songThemes: "అపవాది శక్తులను ఓడించే సిలువ విజయం." },
      { theme: "MORNING", verseTitle: "ఉదయకాలపు కృప", verseLines: ["ఉదయమున నీ కృపను", "నాకు వినిపింపజేయుము,", "నేను నీయందు నమ్మికయుంచియున్నాను."], reference: "— కీర్తనలు 143:8", songName: "ఉదయ కాలమున నీ ముఖము చూచి", songThemes: "ప్రతి రోజూ ఉదయమే దేవుని ముఖదర్శనం చేసుకొనుట." },
      { theme: "PRAISE", verseTitle: "పరిశుద్ధ నామమునకు స్తుతి", verseLines: ["నా ప్రాణమా, యెహోవాను స్తుతించుము;", "నా అంతరంగముననున్న సమస్తమా,", "ఆయన పరిశుద్ధ నామమును స్తుతించుము."], reference: "— కీర్తనలు 103:1", songName: "స్తోత్రము స్తుతి స్తోత్రము (Sthothramu Sthuthi)", songThemes: "సకల మేళ్లకు కృతజ్ఞత చెల్లించే ఆరాధన." }
    ];

    let currentTheme = "ALL";
    let filteredList = [...scriptureDatabase];
    let currentIndex = 0;
    let animFrameId = null;

    const logoImg = new Image();
    logoImg.src = "logo.png";
    const qrImg = new Image();
    qrImg.src = "qr.png";

    function initThemeBadges() {
      const badgeBox = document.getElementById("badgeContainer");
      badgeBox.innerHTML = "";
      bibleThemes.forEach(t => {
        const b = document.createElement("span");
        b.className = "badge" + (t.id === currentTheme ? " active" : "");
        b.innerText = t.name;
        b.onclick = () => selectTheme(t.id);
        badgeBox.appendChild(b);
      });
    }

    function selectTheme(themeId) {
      currentTheme = themeId;
      document.getElementById("searchInput").value = "";
      initThemeBadges();

      if (themeId === "ALL") {
        filteredList = [...scriptureDatabase];
      } else {
        filteredList = scriptureDatabase.filter(item => item.theme === themeId);
      }
      currentIndex = 0;
      updateDropdown();
    }

    function handleSearch() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!q) {
        selectTheme(currentTheme);
        return;
      }

      filteredList = scriptureDatabase.filter(item => {
        return item.verseTitle.toLowerCase().includes(q) ||
               item.verseLines.join(" ").toLowerCase().includes(q) ||
               item.reference.toLowerCase().includes(q) ||
               item.songName.toLowerCase().includes(q);
      });

      currentIndex = 0;
      updateDropdown();
    }

    function updateDropdown() {
      const select = document.getElementById("entrySelect");
      select.innerHTML = "";
      if (filteredList.length === 0) {
        const opt = document.createElement("option");
        opt.innerText = "No matching scriptures";
        select.appendChild(opt);
        return;
      }

      filteredList.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        opt.innerText = `${item.verseTitle} (${item.reference.replace('— ', '')}) — ${item.songName.split('(')[0]}`;
        select.appendChild(opt);
      });
      select.value = currentIndex;
      updateCards();
    }

    function loadSelectedEntry() {
      currentIndex = parseInt(document.getElementById("entrySelect").value);
      updateCards();
    }

    function randomizeInTheme() {
      if (filteredList.length <= 1) return;
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * filteredList.length);
      } while (nextIdx === currentIndex && filteredList.length > 1);

      currentIndex = nextIdx;
      document.getElementById("entrySelect").value = currentIndex;
      updateCards();
    }

    function updateCards() {
      const item = filteredList[currentIndex];
      if (!item) return;
      document.getElementById("songTitle").innerText = item.songName;
      document.getElementById("songDesc").innerText = item.songThemes;
      document.getElementById("ytMeta").innerText = 
        `${item.verseTitle} 🙏 | ${item.reference} | Song: ${item.songName} #Shorts #TeluguChristian #MotivatingChristian`;
    }

    // LIVE ANIMATION ENGINE (Running continuously at 30fps)
    function startAnimationLoop() {
      const canvas = document.getElementById("shortsCanvas");
      const ctx = canvas.getContext("2d");

      function drawFrame(time) {
        const item = filteredList[currentIndex];
        const style = visualStyles[activeStyleKey];

        if (item) {
          const pulse = Math.sin(time / 650); // Periodic gentle breathing cycle
          const glowAlpha = 0.28 + pulse * 0.12;

          // 1. Theme Gradient Background
          const bgGrad = ctx.createLinearGradient(0, 0, 0, 1920);
          bgGrad.addColorStop(0, style.bgTop);
          bgGrad.addColorStop(0.4, style.bgMid);
          bgGrad.addColorStop(0.8, style.bgTop);
          bgGrad.addColorStop(1, style.bgBottom);
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, 1080, 1920);

          // 2. Animated Sunburst Flare Behind Logo
          const sunRadius = 520 + pulse * 45;
          const sunGlow = ctx.createRadialGradient(540, 290, 40, 540, 290, sunRadius);
          sunGlow.addColorStop(0, style.glowColor + glowAlpha + ")");
          sunGlow.addColorStop(0.5, style.glowColor + (glowAlpha * 0.3) + ")");
          sunGlow.addColorStop(1, "rgba(0, 0, 0, 0)");
          ctx.fillStyle = sunGlow;
          ctx.fillRect(0, 0, 1080, 1920);

          // 3. Double Animated Geometric Borders
          ctx.strokeStyle = style.borderOuter;
          ctx.lineWidth = 3;
          ctx.strokeRect(36, 36, 1008, 1848);

          ctx.strokeStyle = style.borderInner;
          ctx.lineWidth = 1.5;
          ctx.strokeRect(48, 48, 984, 1824);

          // Corner Gold Markers
          const drawCorner = (x, y) => {
            ctx.fillStyle = style.accentColor;
            ctx.fillRect(x - 6, y - 6, 12, 12);
          };
          drawCorner(48, 48);
          drawCorner(1032, 48);
          drawCorner(48, 1872);
          drawCorner(1032, 1872);

          // 4. Circular Logo Badge with Breathing Glow
          if (logoImg.complete && logoImg.naturalWidth > 0) {
            ctx.save();
            ctx.shadowColor = style.glowColor + "0.7)";
            ctx.shadowBlur = 25 + pulse * 10;
            ctx.beginPath();
            ctx.arc(540, 290, 140, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(logoImg, 400, 150, 280, 280);
            ctx.restore();

            ctx.strokeStyle = style.accentColor;
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(540, 290, 140, 0, Math.PI * 2);
            ctx.stroke();
          }

          // 5. Header Title Bar
          ctx.fillStyle = style.accentColor;
          ctx.font = "bold 46px -apple-system, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(item.verseTitle, 540, 520);

          ctx.fillStyle = style.borderOuter;
          ctx.fillRect(320, 545, 170, 3);
          ctx.fillText("✝", 540, 554);
          ctx.fillRect(590, 545, 170, 3);

          // 6. Main Scripture Text
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 46px -apple-system, sans-serif";
          ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
          ctx.shadowBlur = 18;

          let startY = 780;
          item.verseLines.forEach(line => {
            ctx.fillText(line, 540, startY);
            startY += 90;
          });

          // Scripture Reference
          ctx.fillStyle = "#facc15";
          ctx.font = "italic bold 40px -apple-system, sans-serif";
          ctx.fillText(item.reference, 540, startY + 30);
          ctx.shadowBlur = 0;

          // 7. Dynamic Audio Visualizer Waves (Worship Pulse Effect)
          ctx.fillStyle = style.borderOuter;
          ctx.fillRect(200, 1240, 680, 2);

          // Render 16 dancing audio visualizer bars
          const barCount = 16;
          const barWidth = 6;
          const startBarX = 540 - ((barCount * 14) / 2);
          for (let i = 0; i < barCount; i++) {
            const barH = 12 + Math.abs(Math.sin((time / 300) + (i * 0.5))) * 28;
            ctx.fillStyle = style.subColor;
            ctx.fillRect(startBarX + i * 14, 1285 - barH / 2, barWidth, barH);
          }

          ctx.fillStyle = "#94a3b8";
          ctx.font = "bold 26px -apple-system, sans-serif";
          ctx.fillText("🎵 ధ్యాన గీతం (Connected Worship Song)", 540, 1335);

          ctx.fillStyle = style.subColor;
          ctx.font = "bold 40px -apple-system, sans-serif";
          ctx.fillText(item.songName, 540, 1395);

          ctx.fillStyle = style.borderOuter;
          ctx.fillRect(200, 1440, 680, 2);

          // 8. QR Code and Branding
          const qrX = 770, qrY = 1530, qrSize = 210;
          if (qrImg.complete && qrImg.naturalWidth > 0) {
            ctx.save();
            ctx.shadowColor = style.glowColor + "0.5)";
            ctx.shadowBlur = 20;
            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            ctx.restore();

            ctx.strokeStyle = style.accentColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(qrX, qrY, qrSize, qrSize);
          }

          ctx.textAlign = "left";
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 38px -apple-system, sans-serif";
          ctx.fillText("ఆమెన్ అని కామెంట్ చేయండి", 90, 1610);

          ctx.fillStyle = style.accentColor;
          ctx.font = "bold 32px -apple-system, sans-serif";
          ctx.fillText("@Motivatingchristian", 90, 1670);

          ctx.fillStyle = "#94a3b8";
          ctx.font = "24px -apple-system, sans-serif";
          ctx.fillText("👉 Scan QR to Subscribe on YouTube", 90, 1725);
        }

        animFrameId = requestAnimationFrame(drawFrame);
      }

      animFrameId = requestAnimationFrame(drawFrame);
    }

    // DIRECT IN-BROWSER MP4/WEBM VIDEO RECORDER
    let isRecording = false;

    function recordAnimatedVideo() {
      if (isRecording) return;
      const canvas = document.getElementById("shortsCanvas");
      const recordBtn = document.getElementById("recordBtn");

      // Capture 30 FPS video stream directly from canvas
      const stream = canvas.captureStream(30);
      let options = { mimeType: 'video/webm;codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(stream, options);
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const cleanRef = filteredList[currentIndex].reference.replace(/[^a-zA-Z0-9]/g, "_");
        a.download = `MotivatingChristian_Short_${cleanRef}.webm`;
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);

        isRecording = false;
        recordBtn.classList.remove("recording");
        recordBtn.innerText = "🎬 Record 10s Video";
      };

      // 10-Second Short Recording Countdown
      isRecording = true;
      recordBtn.classList.add("recording");
      let secondsLeft = 10;
      recordBtn.innerText = `🔴 Recording (${secondsLeft}s)...`;

      const countdown = setInterval(() => {
        secondsLeft--;
        if (secondsLeft > 0) {
          recordBtn.innerText = `🔴 Recording (${secondsLeft}s)...`;
        } else {
          clearInterval(countdown);
        }
      }, 1000);

      recorder.start();
      setTimeout(() => {
        recorder.stop();
      }, 10000); // Stop at 10 seconds
    }

    function downloadShortFrame() {
      const canvas = document.getElementById("shortsCanvas");
      const link = document.createElement("a");
      const cleanRef = filteredList[currentIndex].reference.replace(/[^a-zA-Z0-9]/g, "_");
      link.download = `MotivatingChristian_${cleanRef}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    window.onload = () => {
      initThemeBadges();
      updateDropdown();
      startAnimationLoop();
    };
